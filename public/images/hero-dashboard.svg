<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Absar compliance dashboard preview">
  <defs>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161618"/><stop offset="1" stop-color="#0b0b0c"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2997ff"/><stop offset="1" stop-color="#64d2ff"/>
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bf5af2"/><stop offset="1" stop-color="#5e5ce6"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#30d158"/><stop offset="1" stop-color="#66e08a"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0.25" stop-color="#30d158"/><stop offset="1" stop-color="#64d2ff"/>
    </linearGradient>
    <radialGradient id="ambientBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2997ff" stop-opacity="0.35"/><stop offset="1" stop-color="#2997ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambientPurple" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#bf5af2" stop-opacity="0.28"/><stop offset="1" stop-color="#bf5af2" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="26"/></filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <circle cx="240" cy="640" r="300" fill="url(#ambientBlue)" filter="url(#softBlur)"/>
  <circle cx="980" cy="200" r="280" fill="url(#ambientPurple)" filter="url(#softBlur)"/>

  <g filter="url(#cardShadow)">
    <rect x="90" y="60" width="1020" height="640" rx="22" fill="url(#screenGrad)" stroke="#3a3a3c"/>
    <rect x="90" y="60" width="1020" height="52" rx="22" fill="#232326"/>
    <rect x="90" y="92" width="1020" height="20" fill="#232326"/>
    <circle cx="122" cy="86" r="6" fill="#ff5f57"/><circle cx="142" cy="86" r="6" fill="#febc2e"/><circle cx="162" cy="86" r="6" fill="#28c840"/>
    <rect x="480" y="78" width="240" height="16" rx="8" fill="#3a3a3c"/>

    <rect x="106" y="128" width="150" height="556" rx="14" fill="#1a1a1c"/>
    <rect x="122" y="148" width="96" height="12" rx="6" fill="url(#blueGlow)"/>
    <rect x="122" y="186" width="118" height="10" rx="5" fill="#64b5ff"/>
    <rect x="122" y="214" width="100" height="10" rx="5" fill="#48484a"/>
    <rect x="122" y="242" width="112" height="10" rx="5" fill="#48484a"/>
    <rect x="122" y="270" width="88" height="10" rx="5" fill="#48484a"/>
    <rect x="122" y="298" width="104" height="10" rx="5" fill="#48484a"/>
    <rect x="122" y="326" width="94" height="10" rx="5" fill="#48484a"/>
  </g>

  <!-- score ring card -->
  <rect x="272" y="128" width="250" height="220" rx="16" fill="#1d1d1f" stroke="#2c2c2e"/>
  <circle cx="397" cy="216" r="62" stroke="#2c2c2e" stroke-width="13" fill="none"/>
  <path d="M 397 154 A 62 62 0 1 1 340 247" stroke="url(#ringGrad)" stroke-width="13" stroke-linecap="round" fill="none"/>
  <text x="397" y="212" text-anchor="middle" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="34" font-weight="700" fill="#f5f5f7">92</text>
  <text x="397" y="234" text-anchor="middle" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="11" fill="#86868b">COMPLIANCE SCORE</text>
  <rect x="330" y="300" width="70" height="24" rx="12" fill="rgba(48,209,88,0.15)"/>
  <text x="365" y="316" text-anchor="middle" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#30d158">LOW RISK</text>
  <rect x="410" y="300" width="76" height="24" rx="12" fill="rgba(41,151,255,0.15)"/>
  <text x="448" y="316" text-anchor="middle" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#64b5ff">VERIFIED</text>

  <!-- verification list -->
  <rect x="538" y="128" width="556" height="220" rx="16" fill="#1d1d1f" stroke="#2c2c2e"/>
  <text x="562" y="158" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#f5f5f7">Portal Verifications</text>

  <rect x="562" y="176" width="508" height="36" rx="9" fill="#232326"/>
  <circle cx="584" cy="194" r="9" fill="url(#greenGrad)"/><path d="M579.5 194l3 3 6-6" stroke="#04140a" stroke-width="2" stroke-linecap="round" fill="none"/>
  <text x="604" y="199" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="12" fill="#d6d6d7">GSTN — GSTIN 27ABCDE1234F1Z5</text>
  <rect x="1010" y="184" width="44" height="20" rx="10" fill="rgba(48,209,88,0.15)"/>
  <text x="1032" y="198" text-anchor="middle" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="10" font-weight="600" fill="#30d158">PASS</text>

  <rect x="562" y="220" width="508" height="36" rx="9" fill="#232326"/>
  <circle cx="584" cy="238" r="9" fill="url(#greenGrad)"/><path d="M579.5 238l3 3 6-6" stroke="#04140a" stroke-width="2" stroke-linecap="round" fill="none"/>
  <text x="604" y="243" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="12" fill="#d6d6d7">Udyam — UDYAM-MH-00-0012345</text>
  <rect x="1010" y="228" width="44" height="20" rx="10" fill="rgba(48,209,88,0.15)"/>
  <text x="1032" y="242" text-anchor="middle" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="10" font-weight="600" fill="#30d158">PASS</text>

  <rect x="562" y="264" width="508" height="36" rx="9" fill="#232326"/>
  <circle cx="584" cy="282" r="9" fill="#ffd60a"/>
  <text x="604" y="287" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="12" fill="#d6d6d7">EPFO — Establishment lookup</text>
  <rect x="996" y="272" width="58" height="20" rx="10" fill="rgba(255,214,10,0.13)"/>
  <text x="1025" y="286" text-anchor="middle" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="10" font-weight="600" fill="#ffd60a">REVIEW</text>

  <rect x="562" y="308" width="508" height="32" rx="9" fill="#232326"/>
  <circle cx="584" cy="324" r="9" fill="url(#greenGrad)"/><path d="M579.5 324l3 3 6-6" stroke="#04140a" stroke-width="2" stroke-linecap="round" fill="none"/>
  <text x="604" y="329" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="12" fill="#d6d6d7">PAN / NSDL — ABCDE1234F</text>
  <rect x="1010" y="314" width="44" height="20" rx="10" fill="rgba(48,209,88,0.15)"/>
  <text x="1032" y="328" text-anchor="middle" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="10" font-weight="600" fill="#30d158">PASS</text>

  <!-- bottom row: AI recommendation + risk chart -->
  <rect x="272" y="364" width="556" height="180" rx="16" fill="#1d1d1f" stroke="#2c2c2e"/>
  <rect x="296" y="388" width="26" height="26" rx="8" fill="url(#purpleGlow)"/>
  <text x="334" y="406" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#f5f5f7">AI Recommendation</text>
  <rect x="296" y="428" width="508" height="10" rx="5" fill="#3a3a3c"/>
  <rect x="296" y="428" width="380" height="10" rx="5" fill="url(#blueGlow)"/>
  <rect x="296" y="452" width="508" height="10" rx="5" fill="#3a3a3c"/>
  <rect x="296" y="452" width="300" height="10" rx="5" fill="#48484a"/>
  <rect x="296" y="476" width="420" height="10" rx="5" fill="#2c2c2e"/>
  <rect x="296" y="500" width="150" height="24" rx="12" fill="rgba(41,151,255,0.15)"/>
  <text x="371" y="516" text-anchor="middle" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#64b5ff">APPROVE FOR EVALUATION</text>

  <rect x="844" y="364" width="250" height="180" rx="16" fill="#1d1d1f" stroke="#2c2c2e"/>
  <text x="868" y="392" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#f5f5f7">Bid Distribution</text>
  <g>
    <rect x="872" y="480" width="34" height="44" rx="6" fill="#30d158" opacity="0.9"/>
    <rect x="918" y="452" width="34" height="72" rx="6" fill="#64b5ff" opacity="0.9"/>
    <rect x="964" y="424" width="34" height="100" rx="6" fill="#bf5af2" opacity="0.85"/>
    <rect x="1010" y="496" width="34" height="28" rx="6" fill="#ffd60a" opacity="0.85"/>
  </g>
  <line x1="868" y1="524" x2="1068" y2="524" stroke="#3a3a3c"/>

  <!-- floating document chip -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="470" width="240" height="120" rx="18" fill="#232326" stroke="#3a3a3c"/>
    <rect x="84" y="494" width="40" height="48" rx="7" fill="url(#screenGrad)" stroke="#48484a"/>
    <path d="M94 512h20M94 520h14M94 528h18" stroke="#64b5ff" stroke-width="2.5" stroke-linecap="round"/>
    <text x="138" y="512" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#f5f5f7">GST Certificate.pdf</text>
    <rect x="138" y="522" width="88" height="18" rx="9" fill="rgba(48,209,88,0.15)"/>
    <text x="182" y="535" text-anchor="middle" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="10" font-weight="600" fill="#30d158">OCR EXTRACTED</text>
    <rect x="84" y="556" width="192" height="8" rx="4" fill="url(#greenGrad)"/>
  </g>

  <!-- floating shield badge -->
  <g filter="url(#cardShadow)">
    <rect x="900" y="580" width="200" height="76" rx="18" fill="#232326" stroke="#3a3a3c"/>
    <circle cx="938" cy="618" r="20" fill="url(#blueGlow)"/>
    <path d="M938 606l-9 4v6c0 5.5 3.8 9.4 9 11 5.2-1.6 9-5.5 9-11v-6l-9-4z" fill="#fff"/>
    <path d="M934 618l3 3 6-6" stroke="#0071e3" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="968" y="614" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#f5f5f7">14+ Gov Portals</text>
    <text x="968" y="632" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="10" fill="#86868b">Cross-verified</text>
  </g>

  <!-- reflection fade -->
  <rect x="90" y="700" width="1020" height="60" fill="url(#ambientPurple)" opacity="0.25"/>
</svg>
